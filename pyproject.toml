[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "ancient-algorithms"
version = "0.1.0"
description = "Documented historical algorithms, implemented in Python and checked against their sources"
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-PROSE.md"]
requires-python = ">=3.11"
authors = [{ name = "Prasad Subrahmanya" }]
keywords = ["history of mathematics", "kuttaka", "aryabhata", "madhava", "babylonian", "algorithms", "chinese remainder theorem", "sunzi", "qin jiushao", "plimpton 322", "pythagorean triples"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Education",
]

[project.urls]
Homepage = "https://prasad.tech/ancient-algorithms/"
Source = "https://github.com/prasadus92/ancient-algorithms"

[dependency-groups]
dev = ["pytest>=9.2", "hypothesis>=6.170", "ruff>=0.17", "mypy>=2.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ancient_algorithms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "benchmarks"]
