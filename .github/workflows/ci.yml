name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - run: uv run python benchmarks/kuttaka_vs_euclid.py
      - run: uv run python benchmarks/madhava_convergence.py
      - run: uv run python benchmarks/qiuyi_vs_euclid.py
      - run: uv run python benchmarks/chakravala_vs_continued_fraction.py
